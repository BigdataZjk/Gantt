          application/json:
            schema:
              $ref: '#/components/schemas/Mutation'
  /api/requests/{id}:
    put:
      operationId: putApiRequestsId
      summary: 修改需求
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
