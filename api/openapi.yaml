  /api/logout:
    post:
      operationId: postApiLogout
      summary: 退出登录
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          description: 校验失败
        '401':
          description: 未登录
        '403':
