        schema:
          type: string
    delete:
      operationId: deleteApiRequestsId
      summary: 删除需求
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          description: 校验失败
        '401':
          description: 未登录
        '403':
          description: 权限不足
        '409':
          description: 版本冲突
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionInput'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/requests/batch:
    post:
      operationId: postApiRequestsBatch
      summary: 批量顺排
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          description: 校验失败
        '401':
