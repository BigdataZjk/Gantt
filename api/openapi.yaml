      operationId: getEvents
      summary: SSE 变更通知，重连后重新读取 state
      responses:
        '200':
          description: 事件流
          content:
            text/event-stream:
              schema:
                type: string
  /api/avatar:
    post:
      operationId: postAvatar
      summary: 上传原始头像，最多 4 MiB，支持 GIF/PNG/JPEG/WebP
      requestBody:
        required: true
        content:
          image/gif:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: 更新后的 state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
  /api/avatars/{id}:
    get:
      operationId: getAvatar
      summary: 读取原始头像（保留GIF动画）
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 原始图片字节
components:
  schemas:
    Segment:
      type: object
      required:
      - start
      - end
      properties:
        start:
          type: string
        end:
          type: string
        holdBefore:
          type: boolean
          default: false
      additionalProperties: false
    Request:
      type: object
      required:
      - id
      - revision
      - name
      - priority
      - status
      - prd
      - requester
      - requestedAt
      - domain
      - requestType
      - wangyue
      - developer
      - days
      - start
      - delivery
      - project
      - brd
      - review
      - expected
      - notes
      - segments
      - vacation
      - overtime
      - archived
      properties:
        id:
          type: integer
          format: int64
        revision:
          type: integer
          format: int64
        name:
          type: string
        priority:
          type: string
          enum:
          - P0
          - P1
          - P2
        status:
          type: string
          enum:
          - 待评审
          - 待开发
          - 开发中
          - 已完成
          - HOLD
        prd:
          type: string
        requester:
          type: string
        requestedAt:
          type: string
        domain:
          type: string
        requestType:
          type: string
          enum:
          - 常规需求
          - 数据需求
        wangyue:
          type: string
        developer:
          type: string
        days:
          type: number
        start:
          type: string
        delivery:
          type: string
        project:
          type: string
        brd:
          type: string
        review:
          type: string
        expected:
          type: string
        notes:
          type: string
        segments:
          type: array
          items:
            $ref: '#/components/schemas/Segment'
        vacation:
          type: array
          items:
            type: string
        overtime:
          type: array
          items:
            type: string
        archived:
          type: boolean
      additionalProperties: false
    User:
      type: object
      required:
      - id
      - username
      - role
      - disabled
      - deleted
      - avatar
      properties:
        id:
          type: string
        username:
          type: string
        role:
          type: string
          enum:
          - superadmin
          - admin
          - collaborator
          - readonly
        disabled:
          type: boolean
        deleted:
          type: boolean
        avatar:
          type: string
      additionalProperties: false
    Domain:
      type: object
      required:
      - id
      - name
      - color
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string
      additionalProperties: false
    Preferences:
      type: object
      required:
      - theme
      - density
      - defaultPriority
      - defaultRequestType
      - domainColors
      - ui
      properties:
        theme:
          type: string
          enum:
          - system
          - light
          - dark
        density:
          type: string
          enum:
          - compact
          - comfortable
        defaultPriority:
          type: string
        defaultRequestType:
          type: string
        domainColors:
          type: object
          additionalProperties:
            type: string
        ui:
          type: object
          additionalProperties: {}
      additionalProperties: false
    LogPolicy:
      type: object
      required: [operationRetentionDays, archiveRetentionDays]
      properties:
        operationRetentionDays:
          type: integer
          minimum: 0
          maximum: 3650
          description: 0 关闭按天清理；始终保留最近 200 条上限
        archiveRetentionDays:
          type: integer
          minimum: 0
          maximum: 3650
