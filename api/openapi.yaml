openapi: 3.0.3
info:
  title: RSM API
  version: 0.1.8
paths:
  /api/state:
    get:
      operationId: getApiState
      summary: 获取当前共享资料和个人偏好
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          description: 校验失败
        '401':
          description: 未登录
        '403':
          description: 权限不足
        '409':
          description: 版本冲突
  /api/agent/snapshot:
    get:
      operationId: getAgentSnapshot
      summary: 获取需求与甘特图排期快照
      description: 一次返回完整需求池、归档、甘特图排期和补位。沿用游客只读权限，无需会话。
      security: []
      responses:
        '200':
          description: 同一数据版本的需求和排期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSnapshot'
        '500':
          description: 无法读取快照
  /api/login:
    post:
      operationId: postApiLogin
      summary: 登录
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          description: 校验失败
        '401':
          description: 未登录
        '403':
          description: 权限不足
        '409':
          description: 版本冲突
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
  /api/setup:
    post:
      operationId: postApiSetup
      summary: 设置初始超管密码
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          description: 校验失败
        '401':
          description: 未登录
        '403':
          description: 权限不足
        '409':
          description: 版本冲突
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupInput'
  /api/logout:
    post:
      operationId: postApiLogout
      summary: 退出登录
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          description: 校验失败
        '401':
          description: 未登录
        '403':
          description: 权限不足
        '409':
          description: 版本冲突
  /api/auth/password:
    post:
      operationId: postApiAuthPassword
      summary: 修改本人密码
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          description: 校验失败
        '401':
          description: 未登录
        '403':
          description: 权限不足
        '409':
          description: 版本冲突
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordInput'
  /api/auth/password/{id}:
    get:
      operationId: getApiAuthPasswordId
      summary: 超管查看密码
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordValue'
        '400':
          description: 校验失败
        '401':
          description: 未登录
        '403':
          description: 权限不足
        '409':
          description: 版本冲突
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/users:
    post:
      operationId: postApiUsers
      summary: 创建账号
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          description: 校验失败
        '401':
          description: 未登录
        '403':
          description: 权限不足
        '409':
          description: 版本冲突
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
  /api/users/{id}:
    patch:
      operationId: patchApiUsersId
      summary: 更新账号
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          description: 校验失败
        '401':
          description: 未登录
        '403':
          description: 权限不足
        '409':
          description: 版本冲突
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/calendar/refresh:
    post:
      operationId: postApiCalendarRefresh
      summary: 管理员刷新公开年度日历
      parameters:
      - $ref: '#/components/parameters/P0DeliveryConfirmationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseRevision, year]
              properties:
                baseRevision:
                  type: integer
                  format: int64
                year:
                  type: integer
                  minimum: 2000
                  maximum: 2099
              additionalProperties: false
      responses:
        '200':
          description: 日历更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          description: 来源不可用或日历无效，保留原日历
        '401':
          description: 未登录
        '403':
          description: 仅管理员可更新
        '409':
          description: 版本冲突
        '428':
          $ref: '#/components/responses/P0DeliveryConfirmationRequired'
  /api/calendar/import:
    post:
      operationId: postApiCalendarImport
      summary: 管理员导入年度日历 JSON
      parameters:
      - $ref: '#/components/parameters/P0DeliveryConfirmationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseRevision, year, calendar]
              properties:
                baseRevision:
                  type: integer
                  format: int64
                year:
                  type: integer
                  minimum: 2000
                  maximum: 2099
                calendar:
                  type: object
                  additionalProperties: true
              additionalProperties: false
      responses:
        '200':
          description: 日历更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          description: 来源不可用或日历无效，保留原日历
        '401':
          description: 未登录
        '403':
          description: 仅管理员可更新
        '409':
          description: 版本冲突
        '428':
          $ref: '#/components/responses/P0DeliveryConfirmationRequired'
  /api/preferences:
    put:
      operationId: putApiPreferences
      summary: 保存个人偏好
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          description: 校验失败
        '401':
          description: 未登录
        '403':
          description: 权限不足
        '409':
          description: 版本冲突
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
  /api/announcement:
    put:
      operationId: putApiAnnouncement
      summary: 更新顶栏系统公告
      description: 仅超级管理员可更新。已发布的公告会随共享状态同步给所有访客。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - baseRevision
              - text
              properties:
                baseRevision:
                  type: integer
                  format: int64
                text:
                  type: string
                  minLength: 1
                  description: 纯文本，去除首尾空白后须包含内容。
              additionalProperties: false
      responses:
        '200':
          description: 公告已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          description: 校验失败
        '401':
          description: 未登录
        '403':
          description: 仅超级管理员可更新
        '409':
          description: 版本冲突
  /api/backups/download:
    post:
      operationId: downloadBackup
      summary: 超级管理员生成并下载实例备份
      description: 在线生成经过完整性校验的 ZIP，内含数据库、密钥、配置（如有）及校验清单。
      responses:
        '200':
          description: 备份已校验，可下载
          headers:
            Content-Disposition:
              description: 附件文件名，包含程序版本和北京时间
              schema:
                type: string
            X-RSM-Backup-Created-At:
              description: 备份生成时间
              schema:
                type: string
                format: date-time
            X-RSM-Backup-Revision:
              description: 备份中的数据修订号
              schema:
                type: integer
                format: int64
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          description: 未登录
        '403':
          description: 仅超级管理员可下载
        '409':
          description: 已有备份正在生成或下载
        '500':
          description: 备份生成或校验失败
  /api/upgrade:
    get:
      operationId: getUpgradeStatus
      summary: 超级管理员查看实例升级状态
      responses:
        '200':
          description: 当前版本及最近一次升级任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpgradeState'
        '401':
          description: 未登录
        '403':
          description: 仅超级管理员可查看
  /api/upgrade/source:
    post:
      operationId: stageUpgradeSource
      summary: 超级管理员上传并校验源码 ZIP
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: 签名和版本通过校验，等待确认
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpgradeState'
        '400':
          description: 实例不支持网页升级、源码包或签名无效、版本低于当前版本
        '401':
          description: 未登录
        '403':
          description: 仅超级管理员可上传
        '409':
          description: 已有升级操作进行中
        '413':
          description: 源码 ZIP 超过上传大小限制
  /api/upgrade/apply:
    post:
      operationId: applyUpgradeSource
      summary: 超级管理员确认安装已校验的源码 ZIP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartUpgradeInput'
      responses:
        '202':
          description: 独立升级任务已启动
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpgradeState'
        '400':
          description: 请求无效或实例不支持网页升级
        '401':
          description: 未登录
        '403':
          description: 仅超级管理员可确认
        '409':
          description: 文件已变更或已有升级操作进行中
  /api/requests:
    post:
      operationId: postApiRequests
      summary: 创建需求
      responses:
        '200':
          description: 成功
          headers:
            X-RSM-Request-Operation:
              $ref: '#/components/headers/RequestOperation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          description: 校验失败
        '401':
          description: 未登录
        '403':
          description: 权限不足
        '409':
          description: 版本冲突
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Mutation'
  /api/requests/{id}:
    put:
      operationId: putApiRequestsId
      summary: 修改需求
      responses:
        '200':
          description: 成功
          headers:
            X-RSM-Request-Operation:
              $ref: '#/components/headers/RequestOperation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          description: 校验失败
        '401':
          description: 未登录
        '403':
          description: 权限不足
        '409':
          description: 版本冲突
        '428':
          $ref: '#/components/responses/P0DeliveryConfirmationRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestUpdate'
      parameters:
      - $ref: '#/components/parameters/P0DeliveryConfirmationHeader'
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: deleteApiRequestsId
      summary: 删除需求
      description: 管理员可在删除已排期需求时选择前移同一开发人的后续排期。
      responses:
        '200':
          description: 成功
          headers:
            X-RSM-Request-Operation:
              $ref: '#/components/headers/RequestOperation'
            X-RSM-Reflowed-Requests:
              description: 本次删除联动前移的排期需求数。
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          description: 校验失败
        '401':
          description: 未登录
        '403':
          description: 权限不足
        '409':
          description: 版本冲突
        '428':
          $ref: '#/components/responses/P0DeliveryConfirmationRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestDelete'
      parameters:
      - $ref: '#/components/parameters/P0DeliveryConfirmationHeader'
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/requests/batch:
    post:
      operationId: postApiRequestsBatch
      summary: 批量顺排
      parameters:
      - $ref: '#/components/parameters/P0DeliveryConfirmationHeader'
      responses:
        '200':
          description: 成功
          headers:
            X-RSM-Request-Operation:
              $ref: '#/components/headers/RequestOperation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          description: 校验失败
        '401':
          description: 未登录
        '403':
          description: 权限不足
        '409':
          description: 版本冲突
        '428':
          $ref: '#/components/responses/P0DeliveryConfirmationRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchMutation'
  /api/requests/operations/{id}/reverse:
    post:
      operationId: reverseRequestOperation
      summary: 撤回或重做本人需求操作，保留其他用户的后续变更
      parameters:
        - $ref: '#/components/parameters/P0DeliveryConfirmationHeader'
        - in: path
          name: id
          description: 需求变更响应头 X-RSM-Request-Operation 中的操作编号
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseRevision]
              properties:
                baseRevision:
                  type: integer
                  format: int64
                redo:
                  type: boolean
      responses:
        '200':
          description: 更新后的共享数据
          headers:
            X-RSM-Request-Operation:
              $ref: '#/components/headers/RequestOperation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          description: 操作无法恢复或相关数据已变化
        '401':
          description: 未登录
        '403':
          description: 权限不足或操作属于其他用户
        '409':
          description: 数据版本冲突
        '428':
          $ref: '#/components/responses/P0DeliveryConfirmationRequired'
  /api/requests/gantt-order:
    put:
      operationId: putGanttOrder
      summary: 保存共享甘特图顺序，可同次更换开发人
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GanttOrderInput'
      responses:
        '200':
          description: 更新后的共享数据
          headers:
            X-RSM-Request-Operation:
              $ref: '#/components/headers/RequestOperation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          description: 分组顺序或开发人无效
        '401':
          description: 未登录
        '403':
          description: 权限不足
        '404':
          description: 需求不存在或已归档
        '409':
          description: 数据版本冲突
  /api/requests/priority:
    post:
      operationId: postRequesterRank
      summary: 标注或取消单条需求优先级，或清除整个需求池的优先级
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequesterRankInput'
      responses:
        '200':
          description: 更新后的共享数据
          headers:
            X-RSM-Request-Operation:
              $ref: '#/components/headers/RequestOperation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          description: 优先级操作无效
        '401':
          description: 未登录
        '403':
          description: 权限不足
        '404':
          description: 需求不存在或已归档
        '409':
          description: 数据版本冲突
  /api/requests/{id}/archive:
    post:
      operationId: postApiRequestsIdArchive
      summary: 归档或恢复
      responses:
        '200':
          description: 成功
          headers:
            X-RSM-Request-Operation:
              $ref: '#/components/headers/RequestOperation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          description: 校验失败
        '401':
          description: 未登录
        '403':
          description: 权限不足
        '409':
          description: 版本冲突
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveInput'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/domains:
    post:
      operationId: postApiDomains
      summary: 新增业务域
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          description: 校验失败
        '401':
          description: 未登录
        '403':
          description: 权限不足
        '409':
          description: 版本冲突
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainInput'
  /api/domains/{id}:
    put:
      operationId: putApiDomainsId
      summary: 调整全局域色
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          description: 校验失败
        '401':
          description: 未登录
        '403':
          description: 权限不足
        '409':
          description: 版本冲突
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainInput'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: deleteApiDomainsId
      summary: 删除业务域
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          description: 校验失败
        '401':
          description: 未登录
        '403':
          description: 权限不足
        '409':
          description: 版本冲突
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionInput'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/fields/merge:
    post:
      operationId: postApiFieldsMerge
      summary: 统一自由字段
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          description: 校验失败
        '401':
          description: 未登录
        '403':
          description: 权限不足
        '409':
          description: 版本冲突
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeInput'
  /api/versions:
    post:
      operationId: postApiVersions
      summary: 保存快照
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          description: 校验失败
        '401':
          description: 未登录
        '403':
          description: 权限不足
        '409':
          description: 版本冲突
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionInput'
  /api/versions/{id}:
    delete:
      operationId: deleteApiVersionsId
      summary: 删除快照
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          description: 校验失败
        '401':
          description: 未登录
        '403':
          description: 权限不足
        '409':
          description: 版本冲突
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionInput'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/versions/{id}/restore:
    post:
      operationId: postApiVersionsIdRestore
      summary: 恢复快照
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          description: 校验失败
        '401':
          description: 未登录
        '403':
          description: 权限不足
        '409':
          description: 版本冲突
        '428':
          $ref: '#/components/responses/P0DeliveryConfirmationRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionInput'
      parameters:
      - $ref: '#/components/parameters/P0DeliveryConfirmationHeader'
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/history/{id}/undo:
    post:
      operationId: postApiHistoryIdUndo
      summary: 撤回到指定动作
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          description: 校验失败
        '401':
          description: 未登录
        '403':
          description: 权限不足
        '409':
          description: 版本冲突
        '428':
          $ref: '#/components/responses/P0DeliveryConfirmationRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionInput'
      parameters:
      - $ref: '#/components/parameters/P0DeliveryConfirmationHeader'
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/history/{id}/detail:
    get:
      operationId: getHistoryDetail
      summary: 展开一条操作记录的完整变更
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogDetail'
        '404':
          description: 日志不存在或仅有历史摘要
  /api/logs/management:
    get:
      operationId: getLogManagement
      summary: 管理员查看日志用量、保留策略和最近清理结果
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogManagement'
        '401':
          description: 未登录
        '403':
          description: 权限不足
  /api/logs/policy:
    put:
      operationId: saveLogPolicy
      summary: 管理员保存自动保留天数，0 表示关闭按天清理
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogPolicyInput'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          description: 校验失败
        '401':
          description: 未登录
        '403':
          description: 权限不足
        '409':
          description: 版本冲突
  /api/logs/cleanup/preview:
    post:
      operationId: previewLogCleanup
      summary: 管理员预览北京时间 N 天前零点之前的日志
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogCleanupInput'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogCleanupPreview'
        '400':
          description: 校验失败
        '401':
          description: 未登录
        '403':
          description: 权限不足
  /api/logs/cleanup:
    post:
      operationId: cleanupLogs
      summary: 管理员确认清理；预览、日期或数据已变化时拒绝执行
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogCleanupConfirm'
      responses:
        '200':
          description: 返回实际清理结果；部分文件失败时 cleanup.error 非空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogCleanupResponse'
        '400':
          description: 校验失败
        '401':
          description: 未登录
        '403':
          description: 权限不足
        '409':
          description: 预览或数据已变化，请重新预览
  /api/presence:
    post:
      operationId: postApiPresence
      summary: 在线心跳
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Presence'
        '400':
          description: 校验失败
        '401':
          description: 未登录
        '403':
          description: 权限不足
        '409':
          description: 版本冲突
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresenceInput'
  /api/events:
    get:
      operationId: getEvents
      summary: SSE 推送数据版本（change）和实时在线名单（presence）
      parameters:
      - name: clientId
        in: query
        description: 当前浏览器页面的连接标识，用于统计在线成员和游客
        schema:
          type: string
          minLength: 8
          maxLength: 100
      responses:
        '200':
          description: 事件流
          content:
            text/event-stream:
              schema:
                type: string
  /api/avatar:
    post:
      operationId: postAvatar
      summary: 上传原始头像，最多 4 MiB，支持 GIF/PNG/JPEG/WebP
      requestBody:
        required: true
        content:
          image/gif:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: 更新后的 state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
  /api/avatars/{id}:
    get:
      operationId: getAvatar
      summary: 读取原始头像（保留GIF动画）
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 原始图片字节
components:
  headers:
    RequestOperation:
      description: 本次需求变更的操作编号。有数据变化时返回，可用于撤回或重做。
      schema:
        type: string
  parameters:
    P0DeliveryConfirmationHeader:
      in: header
      name: X-RSM-Confirm-P0-Delivery
      description: 用户核对受影响的 P0 交付日期和有效开发人天后，携带确认凭据重发同一请求。凭据绑定提交人、请求和数据修订。
      schema:
        type: string
  responses:
    P0DeliveryConfirmationRequired:
      description: 本次操作涉及 P0 需求的交付日期或有效开发人天变更，待确认后保存。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/P0DeliveryConfirmationError'
  schemas:
    UpgradeState:
      type: object
      required: [currentVersion, available, maxSourceBytes]
      properties:
        currentVersion:
          type: string
        available:
          type: boolean
        maxSourceBytes:
          type: integer
        job:
          $ref: '#/components/schemas/UpgradeJob'
      additionalProperties: false
    UpgradeJob:
      type: object
      required: [version, sha256, status, step]
      properties:
        version:
          type: string
        sha256:
          type: string
        status:
          type: string
          enum: [ready, starting, running, succeeded, failed]
        step:
          type: integer
          minimum: 0
          maximum: 8
        startedAt:
          type: string
          format: date-time
      additionalProperties: false
    StartUpgradeInput:
      type: object
      required: [sha256]
      properties:
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
      additionalProperties: false
    Segment:
      type: object
      required:
      - start
      - end
      properties:
        start:
          type: string
        end:
          type: string
        holdBefore:
          type: boolean
          default: false
      additionalProperties: false
    SupportSegment:
      type: object
      required:
      - requestId
      - start
      - end
      properties:
        requestId:
          type: integer
          format: int64
        start:
          type: string
        end:
          type: string
      additionalProperties: false
    Request:
      type: object
      required:
      - id
      - revision
      - name
      - priority
      - status
      - prd
      - requester
      - requestedAt
      - domain
      - requestType
      - wangyue
      - developer
      - days
      - start
      - delivery
      - project
      - brd
      - review
      - expected
      - notes
      - segments
      - vacation
      - overtime
      - archived
      properties:
        id:
          type: integer
          format: int64
        revision:
          type: integer
          format: int64
        name:
          type: string
        priority:
          type: string
          enum:
          - P0
          - P1
          - P2
        requesterRank:
          type: integer
          minimum: 1
          description: 需求池中需求方标注的优先级序号，由优先级接口维护
        status:
          type: string
          enum:
          - 待评审
          - 待开发
          - 开发中
          - 已完成
          - HOLD
        prd:
          type: string
        requester:
          type: string
        requestedAt:
          type: string
        domain:
          type: string
        requestType:
          type: string
          enum:
          - 常规需求
          - 数据需求
        wangyue:
          type: string
        developer:
          type: string
        days:
          type: number
        start:
          type: string
        delivery:
          type: string
        project:
          type: string
        brd:
          type: string
        review:
          type: string
        expected:
          type: string
        notes:
          type: string
        segments:
          type: array
          items:
            $ref: '#/components/schemas/Segment'
        vacation:
          type: array
          items:
            type: string
        overtime:
          type: array
          items:
            type: string
        supportSegments:
          type: array
          description: 甘特图所在开发人行的补位日期及单向需求引用。更新时省略即保留，空数组清除。
          items:
            $ref: '#/components/schemas/SupportSegment'
        archived:
          type: boolean
        poolEnteredAt:
          type: string
          description: 服务端记录的最近进池时间，旧记录可能缺失，客户端提交时忽略。
        archivedAt:
          type: string
          description: 服务端记录的最近归档时间，旧记录可能缺失，客户端提交时忽略。
      additionalProperties: false
    AgentSnapshot:
      type: object
      required: [revision, serverVersion, calendar, requests, support]
      properties:
        revision:
          type: integer
          format: int64
        serverVersion:
          type: string
        calendar:
          $ref: '#/components/schemas/Calendar'
        requests:
          type: array
          items:
            $ref: '#/components/schemas/AgentRequest'
        ganttRowOrder:
          $ref: '#/components/schemas/GanttRowOrder'
        support:
          type: array
          items:
            $ref: '#/components/schemas/AgentSupport'
      additionalProperties: false
    AgentRequest:
      type: object
      required: [request, developerName, schedule]
      properties:
        request:
          $ref: '#/components/schemas/Request'
        developerName:
          type: string
          description: 开发人姓名，未分配或无法解析时为空。
        schedule:
          $ref: '#/components/schemas/AgentSchedule'
      additionalProperties: false
    AgentSchedule:
      type: object
      required: [segments, gaps, scheduledDates, scheduledDays, placeholder]
      properties:
        segments:
          type: array
          description: 甘特图中的排期段，包含由单段开始和交付日期生成的线段。
          items:
            $ref: '#/components/schemas/Segment'
        gaps:
          type: array
          items:
            $ref: '#/components/schemas/AgentScheduleGap'
        scheduledDates:
          type: array
          description: 按日期升序排列的有效开发日，含调休及加班，扣除休假。待估占位也返回日期。
          items:
            type: string
        scheduledDays:
          type: integer
          description: 有效开发日数量。
        placeholder:
          type: boolean
          description: 此排期是待估人天的占位。
      additionalProperties: false
    AgentScheduleGap:
      type: object
      required: [afterIndex, start, end, workdays, hold]
      properties:
        afterIndex:
          type: integer
          description: 间隔所在的上一段排期索引，从 0 开始。
        start:
          type: string
        end:
          type: string
        workdays:
          type: integer
        hold:
          type: boolean
          description: 手动标记 HOLD 且间隔内有工作日。
      additionalProperties: false
    AgentSupport:
      type: object
      required: [ganttRowRequestId, targetRequestId, targetRequestName, supporterId, supporterName, start, end, scheduledDates, scheduledDays]
      properties:
        ganttRowRequestId:
          type: integer
          format: int64
          description: 补位所在的甘特图需求行。
        targetRequestId:
          type: integer
          format: int64
          description: 实际被补位的需求 ID。
        targetRequestName:
          type: string
          description: 目标需求名称，目标已删除时为空。
        supporterId:
          type: string
          description: 补位人的账号 ID，取补位所在行的开发人。
        supporterName:
          type: string
        start:
          type: string
          description: 保存的起始日期，含当天。
        end:
          type: string
          description: 保存的结束日期，含当天。
        scheduledDates:
          type: array
          description: 按补位所在行的日历、休假和加班计算出的有效日期，按日期升序排列。
          items:
            type: string
        scheduledDays:
          type: integer
          description: 有效补位日数量。
      additionalProperties: false
    User:
      type: object
      required:
      - id
      - username
      - role
      - disabled
      - deleted
      - avatar
      properties:
        id:
          type: string
        username:
          type: string
        role:
          type: string
          enum:
          - superadmin
          - admin
          - collaborator
          - readonly
        disabled:
          type: boolean
        deleted:
          type: boolean
        avatar:
          type: string
      additionalProperties: false
    Domain:
      type: object
      required:
      - id
      - name
      - color
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string
      additionalProperties: false
    Preferences:
      type: object
      required:
      - theme
      - density
      - defaultPriority
      - defaultRequestType
      - domainColors
      - ui
      properties:
        theme:
          type: string
          enum:
          - system
          - light
          - dark
        density:
          type: string
          enum:
          - compact
          - comfortable
        defaultPriority:
          type: string
        defaultRequestType:
          type: string
        domainColors:
          type: object
          additionalProperties:
            type: string
        ui:
          type: object
          additionalProperties: {}
      additionalProperties: false
    LogPolicy:
      type: object
      required: [operationRetentionDays, archiveRetentionDays]
      properties:
        operationRetentionDays:
          type: integer
          minimum: 0
          maximum: 3650
          description: 0 关闭按天清理；始终保留最近 200 条上限
        archiveRetentionDays:
          type: integer
          minimum: 0
          maximum: 3650
          description: 0 关闭归档文件按天清理
      additionalProperties: false
    LogPolicyInput:
      type: object
      required: [baseRevision, operationRetentionDays, archiveRetentionDays]
      properties:
        baseRevision:
          type: integer
          format: int64
        operationRetentionDays:
          type: integer
          minimum: 0
          maximum: 3650
        archiveRetentionDays:
          type: integer
          minimum: 0
          maximum: 3650
      additionalProperties: false
    LogCleanupRun:
      type: object
      required: [checkedAt, operationsDeleted, archivesDeleted, bytes, error]
      properties:
        checkedAt:
          type: string
        operationsDeleted:
          type: integer
        archivesDeleted:
          type: integer
        bytes:
          type: integer
          format: int64
        error:
          type: string
      additionalProperties: false
    LogManagement:
      type: object
      required: [policy, operationCount, operationBytes, oldestOperationAt, archiveCount, archiveBytes, activeFileCount, activeFileBytes]
      properties:
        policy:
          $ref: '#/components/schemas/LogPolicy'
        operationCount:
          type: integer
        operationBytes:
          type: integer
          format: int64
        oldestOperationAt:
          type: string
        archiveCount:
          type: integer
        archiveBytes:
          type: integer
          format: int64
        activeFileCount:
          type: integer
        activeFileBytes:
          type: integer
          format: int64
        lastAutomatic:
          $ref: '#/components/schemas/LogCleanupRun'
        lastManual:
          $ref: '#/components/schemas/LogCleanupRun'
      additionalProperties: false
    LogCleanupInput:
      type: object
      required: [scope, days]
      properties:
        scope:
          type: string
          enum: [operations, archives]
        days:
          type: integer
          minimum: 1
          maximum: 3650
      additionalProperties: false
    LogCleanupPreview:
      type: object
      required: [scope, days, before, revision, token, count, bytes, reversibleCount]
      properties:
        scope:
          type: string
          enum: [operations, archives]
        days:
          type: integer
        before:
          type: string
        revision:
          type: integer
          format: int64
        token:
          type: string
        count:
          type: integer
        bytes:
          type: integer
          format: int64
        reversibleCount:
          type: integer
      additionalProperties: false
    LogCleanupConfirm:
      type: object
      required: [baseRevision, scope, days, before, token]
      properties:
        baseRevision:
          type: integer
          format: int64
        scope:
          type: string
          enum: [operations, archives]
        days:
          type: integer
          minimum: 1
          maximum: 3650
        before:
          type: string
        token:
          type: string
      additionalProperties: false
    LogCleanupResponse:
      type: object
      required: [state, cleanup]
      properties:
        state:
          $ref: '#/components/schemas/State'
        cleanup:
          $ref: '#/components/schemas/LogCleanupRun'
      additionalProperties: false
    Log:
      type: object
      required:
      - id
      - actor
      - action
      - createdAt
      - reversible
      - undone
      properties:
        id:
          type: integer
          format: int64
        actor:
          type: string
        action:
          type: string
        createdAt:
          type: string
        reversible:
          type: boolean
        undone:
          type: boolean
        detail:
          $ref: '#/components/schemas/LogDetail'
      additionalProperties: false
    LogDetail:
      type: object
      required: [label]
      properties:
        label:
          type: string
        subject:
          type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/LogValue'
        changes:
          type: array
          items:
            $ref: '#/components/schemas/LogChange'
        remaining:
          type: integer
          description: 摘要中折叠的变更项数
        expandable:
          type: boolean
      additionalProperties: false
    LogChange:
      type: object
      properties:
        subject:
          type: string
        field:
          type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/LogValue'
        before:
          $ref: '#/components/schemas/LogValue'
        after:
          $ref: '#/components/schemas/LogValue'
      additionalProperties: false
    LogValue:
      type: object
      required: [text]
      properties:
        text:
          type: string
        kind:
          type: string
          enum: [priority, status, domain, requestType, role, color, rank, timestamp]
        color:
          type: string
      additionalProperties: false
    Version:
      type: object
      required:
      - id
      - label
      - actor
      - createdAt
      - revision
      properties:
        id:
          type: string
        label:
          type: string
        actor:
          type: string
        createdAt:
          type: string
        revision:
          type: integer
          format: int64
      additionalProperties: false
    HolidayDay:
      type: object
      required: [name, date, isOffDay]
      properties:
        name:
          type: string
        date:
          type: string
        isOffDay:
          type: boolean
      additionalProperties: false
    CalendarEdition:
      type: object
      required: [year, days, papers, source]
      properties:
        year:
          type: integer
        days:
          type: array
          items:
            $ref: '#/components/schemas/HolidayDay'
        papers:
          type: array
          items:
            type: string
        source:
          type: string
        updatedAt:
          type: string
      additionalProperties: false
    Calendar:
      type: object
      required:
      - restDays
      - workDays
      - years
      - source
      properties:
        restDays:
          type: array
          items:
            type: string
        workDays:
          type: array
          items:
            type: string
        years:
          type: array
          items:
            type: integer
        editions:
          type: array
          items:
            $ref: '#/components/schemas/CalendarEdition'
        source:
          type: string
      additionalProperties: false
    State:
      type: object
      required:
      - revision
      - requests
      - domains
      - users
      - me
      - preferences
      - logs
      - versions
      - calendar
      - setupRequired
      - serverVersion
      properties:
        revision:
          type: integer
          format: int64
        requests:
          type: array
          items:
            $ref: '#/components/schemas/Request'
        ganttRowOrder:
          $ref: '#/components/schemas/GanttRowOrder'
        domains:
          type: array
          items:
            $ref: '#/components/schemas/Domain'
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
        me:
          allOf:
          - $ref: '#/components/schemas/User'
          nullable: true
        preferences:
          $ref: '#/components/schemas/Preferences'
        announcement:
          type: string
          description: 顶栏公告正文，首次发布前省略。
        logs:
          type: array
          items:
            $ref: '#/components/schemas/Log'
        logPolicy:
          $ref: '#/components/schemas/LogPolicy'
        versions:
          type: array
          items:
            $ref: '#/components/schemas/Version'
        calendar:
          $ref: '#/components/schemas/Calendar'
        setupRequired:
          type: boolean
        serverVersion:
          type: string
      additionalProperties: false
    GanttRowOrder:
      type: object
      description: 各开发人分组已保存的甘特顺序，空字符串键表示未分配组
      additionalProperties:
        type: array
        items:
          type: integer
          format: int64
    GanttOrderInput:
      type: object
      required: [baseRevision, orders]
      properties:
        baseRevision:
          type: integer
          format: int64
        draggedRequestId:
          type: integer
          format: int64
          description: 组内拖动的需求 ID
        sortByAdmission:
          type: boolean
          description: 由按准入日期排序操作发起
        orders:
          type: array
          minItems: 1
          items:
            type: object
            required: [developer, requestIds]
            properties:
              developer:
                type: string
              requestIds:
                type: array
                description: 对应分组的全部需求 ID，包含已归档需求
                items:
                  type: integer
                  format: int64
            additionalProperties: false
        move:
          type: object
          description: 跨组拖动时同时更新开发人，需要管理员权限
          required: [requestId, developer]
          properties:
            requestId:
              type: integer
              format: int64
            developer:
              type: string
          additionalProperties: false
      additionalProperties: false
    RequesterRankInput:
      type: object
      required: [baseRevision, action]
      properties:
        baseRevision:
          type: integer
          format: int64
        action:
          type: string
          enum: [toggle, clear]
        requestId:
          type: integer
          format: int64
          description: toggle 操作对应的需求 ID，clear 操作省略
      additionalProperties: false
    Mutation:
      type: object
      required:
      - baseRevision
      - request
      properties:
        baseRevision:
          type: integer
          format: int64
        request:
          $ref: '#/components/schemas/Request'
      additionalProperties: false
    ScheduleOperation:
      type: string
      enum: [sequence, ganttUndo]
      description: 发起这次排期变更的操作
    RequestUpdate:
      type: object
      required: [baseRevision, request]
      properties:
        baseRevision:
          type: integer
          format: int64
        request:
          $ref: '#/components/schemas/Request'
        operation:
          $ref: '#/components/schemas/ScheduleOperation'
      additionalProperties: false
    BatchMutation:
      type: object
      required:
      - baseRevision
      - requests
      properties:
        baseRevision:
          type: integer
          format: int64
        requests:
          type: array
          items:
            $ref: '#/components/schemas/Request'
        operation:
          $ref: '#/components/schemas/ScheduleOperation'
      additionalProperties: false
    RequestDelete:
      type: object
      required:
      - baseRevision
      properties:
        baseRevision:
          type: integer
          format: int64
        reflow:
          type: boolean
          description: 为 true 时尝试前移后续排期，仅管理员可用。省略或为 false 时保持原排期。
      additionalProperties: false
    RevisionInput:
      type: object
      required:
      - baseRevision
      properties:
        baseRevision:
          type: integer
          format: int64
      additionalProperties: false
    Error:
      type: object
      required:
      - error
      - code
      properties:
        error:
          type: string
        code:
          type: string
      additionalProperties: false
    P0DeliveryConfirmationError:
      type: object
      required: [error, code, confirmation]
      properties:
        error:
          type: string
        code:
          type: string
          enum: [p0_delivery_confirmation_required]
        confirmation:
          $ref: '#/components/schemas/P0DeliveryConfirmation'
      additionalProperties: false
    P0DeliveryConfirmation:
      type: object
      required: [token, changes]
      properties:
        token:
          type: string
        changes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/P0DeliveryChange'
      additionalProperties: false
    P0DeliveryChange:
      type: object
      required: [requestId, name, before, after]
      properties:
        requestId:
          type: integer
          format: int64
        name:
          type: string
        before:
          type: string
          description: 原交付日期，未排期时为空字符串。
        after:
          type: string
          description: 新交付日期，未排期时为空字符串。
        beforeDays:
          type: integer
          minimum: 0
          description: 变更前的有效开发人天，只有有效开发人天变化时返回。
        afterDays:
          type: integer
          minimum: 0
          description: 变更后的有效开发人天，只有有效开发人天变化时返回。
      additionalProperties: false
    LoginInput:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
        remember:
          type: boolean
          default: true
          description: 勾选时保存登录 30 天，否则使用浏览器会话 Cookie。
      additionalProperties: false
    SetupInput:
      type: object
      required:
      - password
      properties:
        password:
          type: string
      additionalProperties: false
    PasswordInput:
      type: object
      required:
      - currentPassword
      - password
      properties:
        currentPassword:
          type: string
        password:
          type: string
      additionalProperties: false
    PasswordValue:
      type: object
      required:
      - password
      properties:
        password:
          type: string
      additionalProperties: false
    UserInput:
      type: object
      required:
      - username
      - password
      - role
      properties:
        username:
          type: string
        password:
          type: string
        role:
          type: string
      additionalProperties: false
    UserUpdate:
      type: object
      required:
      - role
      - disabled
      - deleted
      - password
      properties:
        role:
          type: string
        disabled:
          type: boolean
        deleted:
          type: boolean
        password:
          type: string
      additionalProperties: false
    ArchiveInput:
      type: object
      required:
      - baseRevision
      - archived
      properties:
        baseRevision:
          type: integer
          format: int64
        archived:
          type: boolean
      additionalProperties: false
    DomainInput:
      type: object
      required:
      - baseRevision
      - name
      - color
      properties:
        baseRevision:
          type: integer
          format: int64
        name:
          type: string
        color:
          type: string
      additionalProperties: false
    MergeInput:
      type: object
      required:
      - baseRevision
      - field
      - values
      - target
      properties:
        baseRevision:
          type: integer
          format: int64
        field:
          type: string
        values:
          type: array
          items:
            type: string
        target:
          type: string
      additionalProperties: false
    VersionInput:
      type: object
      required:
      - baseRevision
      - label
      properties:
        baseRevision:
          type: integer
          format: int64
        label:
          type: string
      additionalProperties: false
    PresenceInput:
      type: object
      required:
      - clientId
      properties:
        clientId:
          type: string
      additionalProperties: false
    Presence:
      type: object
      required:
      - users
      - guests
      properties:
        users:
          type: array
          items:
            type: string
        guests:
          type: integer
          format: int64
      additionalProperties: false
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: rsm_session
security:
- session: []
