  /api/history/{id}/undo:
    post:
      operationId: postApiHistoryIdUndo
      summary: 撤回到指定动作
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
