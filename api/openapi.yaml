      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainInput'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: deleteApiDomainsId
      summary: 删除业务域
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          description: 校验失败
        '401':
          description: 未登录
        '403':
          description: 权限不足
        '409':
          description: 版本冲突
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionInput'
      parameters:
      - name: id
        in: path
        required: true
