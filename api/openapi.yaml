        '400':
          description: 校验失败
        '401':
          description: 未登录
        '403':
          description: 权限不足
        '409':
          description: 版本冲突
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Mutation'
      parameters:
      - name: id
        in: path
