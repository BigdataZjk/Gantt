      operationId: getLogManagement
      summary: 管理员查看日志用量、保留策略和最近清理结果
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogManagement'
        '401':
          description: 未登录
        '403':
          description: 权限不足
  /api/logs/policy:
    put:
      operationId: saveLogPolicy
      summary: 管理员保存自动保留天数，0 表示关闭按天清理
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogPolicyInput'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          description: 校验失败
        '401':
          description: 未登录
        '403':
          description: 权限不足
        '409':
          description: 版本冲突
  /api/logs/cleanup/preview:
    post:
      operationId: previewLogCleanup
      summary: 管理员预览北京时间 N 天前零点之前的日志
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogCleanupInput'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogCleanupPreview'
        '400':
          description: 校验失败
        '401':
          description: 未登录
        '403':
          description: 权限不足
  /api/logs/cleanup:
    post:
      operationId: cleanupLogs
      summary: 管理员确认清理；预览、日期或数据已变化时拒绝执行
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogCleanupConfirm'
      responses:
        '200':
          description: 返回实际清理结果；部分文件失败时 cleanup.error 非空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogCleanupResponse'
        '400':
          description: 校验失败
        '401':
          description: 未登录
        '403':
          description: 权限不足
        '409':
          description: 预览或数据已变化，请重新预览
  /api/presence:
