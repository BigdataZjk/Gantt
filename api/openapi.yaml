  /api/calendar/refresh:
    post:
      operationId: postApiCalendarRefresh
      summary: 管理员刷新公开年度日历
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseRevision, year]
              properties:
                baseRevision:
                  type: integer
                  format: int64
                year:
                  type: integer
                  minimum: 2000
                  maximum: 2099
              additionalProperties: false
      responses:
        '200':
          description: 日历更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          description: 来源不可用或日历无效，保留原日历
        '401':
          description: 未登录
        '403':
          description: 仅管理员可更新
        '409':
          description: 版本冲突
  /api/calendar/import:
    post:
      operationId: postApiCalendarImport
      summary: 管理员导入年度日历 JSON
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseRevision, year, calendar]
              properties:
                baseRevision:
                  type: integer
                  format: int64
                year:
                  type: integer
                  minimum: 2000
                  maximum: 2099
                calendar:
                  type: object
                  additionalProperties: true
              additionalProperties: false
      responses:
        '200':
          description: 日历更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          description: 来源不可用或日历无效，保留原日历
        '401':
          description: 未登录
        '403':
          description: 仅管理员可更新
        '409':
          description: 版本冲突
  /api/preferences:
    put:
      operationId: putApiPreferences
      summary: 保存个人偏好
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          description: 校验失败
        '401':
