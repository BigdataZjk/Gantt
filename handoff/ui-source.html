}

// Efferd Auth Page study: mirrored FloatingPaths, adapted to the existing product modal.
function installAuthModal(product,{accounts,current,guest,passwords,onLogin,onLogout,beforeOpen,escape,icons}){
  const doc=product.ownerDocument,base=product.querySelector('.gm-base'),layer=doc.createElement('div');
  layer.className='gm-auth-layer';layer.hidden=true;
  layer.innerHTML='<button type="button" class="gm-scrim gm-auth-scrim" data-auth-close aria-label="关闭登录窗口"></button><section class="gm-auth-dialog" role="dialog" aria-modal="true" aria-labelledby="gm-auth-title"></section>';
  product.append(layer);
  let returnFocus=null,wasInert=false;
  function paths(){
    return [1,-1].map(position=>`<svg class="gm-auth-paths" viewBox="0 0 696 316" fill="none" aria-hidden="true">${Array.from({length:36},(_,i)=>{
      const d=`M-${380-i*5*position} -${189+i*6}C-${380-i*5*position} -${189+i*6} -${312-i*5*position} ${216-i*6} ${152-i*5*position} ${343-i*6}C${616-i*5*position} ${470-i*6} ${684-i*5*position} ${875-i*6} ${684-i*5*position} ${875-i*6}`;
      return `<path d="${d}" pathLength="1" stroke="currentColor" stroke-width="${(.5+i*.03).toFixed(2)}" stroke-opacity="${Math.min(1,.1+i*.03).toFixed(2)}" style="--gm-path-duration:${20+(i*7+(position===1?0:3))%11}s;--gm-path-delay:-${(i*1.7+(position===1?0:8)).toFixed(1)}s"/>`;
    }).join('')}</svg>`).join('');
  }
  function close(restoreFocus=true){
    if(layer.hidden)return;
    layer.hidden=true;base.inert=wasInert;
    layer.querySelector('section').replaceChildren();
    if(restoreFocus&&returnFocus?.isConnected&&!returnFocus.closest('[inert]'))returnFocus.focus({preventScroll:true});
  }
  function open(){
    if(current()!==guest||!layer.hidden||beforeOpen?.()===false)return;
    returnFocus=doc.activeElement;wasInert=base.inert;
    layer.querySelector('section').innerHTML=`<aside class="gm-auth-art" aria-label="排一下"><div class="gm-auth-graphic" aria-hidden="true">${paths()}</div><div class="gm-auth-brand"><i data-lucide="calendar-range" aria-hidden="true"></i><span>排一下</span></div><div class="gm-auth-art-copy"><p>把需求排好，<br>一起从容推进。</p></div></aside><div class="gm-auth-content"><button type="button" class="gm-btn gm-quiet gm-auth-close" data-auth-close aria-label="关闭登录窗口"><i data-lucide="x" aria-hidden="true"></i></button><form class="gm-auth-form"><div class="gm-auth-heading"><h2 id="gm-auth-title">登录排一下</h2><p>使用已有账号继续协作</p></div><div class="gm-field"><label for="gm-auth-username">用户名</label><input id="gm-auth-username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>${passwords.fieldMarkup('gm-auth-password','密码','autocomplete="current-password" required')}<p class="gm-auth-error" role="alert" hidden></p><button type="submit" class="gm-btn gm-primary gm-auth-submit">登录</button></form></div>`;
    layer.hidden=false;base.inert=true;icons();layer.querySelector('#gm-auth-username').focus({preventScroll:true});
  }
  function clearError(){const error=layer.querySelector('.gm-auth-error');if(!error)return;error.hidden=true;for(const input of layer.querySelectorAll('input')){input.removeAttribute('aria-invalid');input.removeAttribute('aria-describedby');}}
  function showError(message,target='gm-auth-password'){
    const error=layer.querySelector('.gm-auth-error');error.id='gm-auth-error';error.textContent=message;error.hidden=false;
    const input=layer.querySelector('#'+target);input.setAttribute('aria-invalid','true');input.setAttribute('aria-describedby',error.id);input.focus({preventScroll:true});
  }
  function submit(event){
    event.preventDefault();event.stopPropagation();
    const name=layer.querySelector('#gm-auth-username').value.trim(),secret=layer.querySelector('#gm-auth-password').value;
    const account=accounts().find(account=>account.name===name);
    if(!account||account.status==='已删除'){showError('用户名或密码不正确','gm-auth-username');return;}
    if(account.status!=='启用'){showError('账号已停用，请联系超级管理员','gm-auth-username');return;}
    if(!passwords.has(name)){showError('请先由超级管理员设置初始密码');return;}
    if(!passwords.verify(name,secret)){showError('用户名或密码不正确');return;}
    close(false);onLogin(name);product.querySelector('[data-current-user-avatar]')?.focus({preventScroll:true});
  }
  layer.addEventListener('submit',submit);
  layer.addEventListener('input',event=>{event.stopPropagation();clearError();});
  layer.addEventListener('change',event=>event.stopPropagation());
  layer.addEventListener('click',event=>{if(event.target.closest('[data-auth-close]')){event.stopPropagation();close();}});
  layer.addEventListener('keydown',event=>{
    event.stopPropagation();
    if(event.key==='Escape'){event.preventDefault();close();return;}
    if(event.key!=='Tab')return;
    const nodes=[...layer.querySelector('section').querySelectorAll('input,button:not(:disabled)')].filter(node=>node.getClientRects().length);
    if(event.shiftKey&&doc.activeElement===nodes[0]){event.preventDefault();nodes.at(-1)?.focus();}
    else if(!event.shiftKey&&doc.activeElement===nodes.at(-1)){event.preventDefault();nodes[0]?.focus();}
  });
  product.addEventListener('click',event=>{
    if(event.target.closest('[data-auth-login]'))open();
    if(event.target.closest('[data-auth-logout]')&&current()!==guest){close(false);onLogout();product.querySelector('[data-current-user-avatar]')?.focus({preventScroll:true});}
  });
  return {open,close,sync(){if(!layer.hidden&&current()!==guest)close(false);}};
}

// Password interaction study. Entered values stay in this preview's memory, outside snapshots and widget state.
function installPasswordControls(product,{current,loggedIn,isSuper,onChanged,escape,icons}){
  const doc=product.ownerDocument,secrets=new Map(),layer=doc.createElement('div');layer.className='gm-password-layer';layer.hidden=true;layer.innerHTML='<button type="button" class="gm-scrim" data-password-close aria-label="关闭密码面板"></button><section class="gm-password-dialog" role="dialog" aria-modal="true" aria-label="修改密码"></section>';product.append(layer);let target='',reset=false,returnFocus=null,openedBy='';
  function fieldMarkup(id,label,attributes='',value='',required=false) {
    return `<div class="gm-field"><label for="${escape(id)}">${escape(label)}${required?'<span class="gm-required" aria-hidden="true">*</span>':''}</label><div class="gm-password-input"><input id="${escape(id)}" type="password" ${attributes} ${required?'required':''} value="${escape(value)}"><button type="button" class="gm-password-eye" data-password-eye="${escape(id)}" data-password-label="${escape(label)}" aria-label="${escape('显示'+label)}" aria-controls="${escape(id)}" aria-pressed="false" data-tooltip="显示密码" ${attributes.includes('readonly')&&!value?'disabled':''}><i data-lucide="eye" aria-hidden="true"></i></button></div></div>`;
  }
  function close(){layer.hidden=true;product.querySelector('.gm-base').inert=false;returnFocus?.focus({preventScroll:true});layer.querySelector('section').innerHTML='';target='';}
  function open(name,superReset=false){
    if(!loggedIn()||superReset&&!isSuper()||!superReset&&name!==current())return;
    target=name;reset=superReset;openedBy=current();returnFocus=doc.activeElement;const known=secrets.get(name)||'',title=reset?'重设密码':'修改密码';
    layer.querySelector('section').innerHTML=`<div class="gm-password-head"><div><h3>${title}</h3><span class="gm-caption">${escape(name)}</span></div><button type="button" class="gm-btn gm-quiet" data-password-close aria-label="关闭密码面板"><i data-lucide="x" aria-hidden="true"></i></button></div>${fieldMarkup('gm-password-current','当前密码',reset?'readonly placeholder="尚未设置"':'autocomplete="current-password"',reset?known:'')}${fieldMarkup('gm-password-new','新密码','autocomplete="new-password"')}<p class="gm-password-error" role="alert" hidden></p><div class="gm-password-actions"><button type="button" class="gm-btn" data-password-close>取消</button><button type="button" class="gm-btn gm-primary" data-password-commit disabled>${reset?'保存新密码':'修改密码'}</button></div>`;
    layer.hidden=false;product.querySelector('.gm-base').inert=true;icons();layer.querySelector(reset?'#gm-password-new':'#gm-password-current').focus({preventScroll:true});
  }
  function update(){const next=layer.querySelector('#gm-password-new').value,old=layer.querySelector('#gm-password-current').value;layer.querySelector('[data-password-commit]').disabled=!next||(!reset&&!old)||next===(reset?secrets.get(target):old);layer.querySelector('.gm-password-error').hidden=true;}
  function commit(){
    if(!target||!loggedIn()||reset&&!isSuper())return;const old=layer.querySelector('#gm-password-current').value,next=layer.querySelector('#gm-password-new').value,error=layer.querySelector('.gm-password-error');
    const reason=!next?'请输入新密码':!reset&&!secrets.has(target)?'请先由超级管理员设置初始密码':!reset&&secrets.get(target)!==old?'当前密码不正确':next===secrets.get(target)?'新密码没有变化':'';
    if(reason){error.textContent=reason;error.hidden=false;return;}
    const name=target,superReset=reset;secrets.set(name,next);close();onChanged(name,superReset);
  }
  product.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;
    if(button.dataset.passwordEye){const input=doc.getElementById(button.dataset.passwordEye);if(!input)return;const show=input.type==='password';input.type=show?'text':'password';button.setAttribute('aria-pressed',String(show));button.setAttribute('aria-label',(show?'隐藏':'显示')+(button.dataset.passwordLabel||'密码'));button.dataset.tooltip=show?'隐藏密码':'显示密码';button.innerHTML=`<i data-lucide="${show?'eye-off':'eye'}" aria-hidden="true"></i>`;icons();input.focus({preventScroll:true});return;}
    if(button.hasAttribute('data-self-password'))open(current());if(button.dataset.accountPasswordManage&&isSuper())open(button.dataset.accountPasswordManage,true);
  });
  layer.addEventListener('input',update);layer.addEventListener('click',event=>{if(event.target.closest('[data-password-close]'))close();else if(event.target.closest('[data-password-commit]'))commit();});
  layer.addEventListener('keydown',event=>{if(event.key==='Escape'){event.preventDefault();event.stopPropagation();close();}if(event.key==='Enter'&&event.target.tagName==='INPUT'){event.preventDefault();commit();}if(event.key==='Tab'){const nodes=[...layer.querySelector('section').querySelectorAll('input,button:not(:disabled)')];if(event.shiftKey&&event.target===nodes[0]){event.preventDefault();nodes.at(-1).focus();}else if(!event.shiftKey&&event.target===nodes.at(-1)){event.preventDefault();nodes[0].focus();}}});
  return {sync(){if(!layer.hidden&&(!loggedIn()||openedBy!==current()||reset&&!isSuper()))close();},fieldMarkup,set(name,value){if(value)secrets.set(name,value);},has:name=>secrets.has(name),verify:(name,value)=>secrets.has(name)&&secrets.get(name)===value};
}

const avatarImages=new Map();
function readAvatarImage(name){if(avatarImages.has(name))return avatarImages.get(name);try{const data=localStorage.getItem('paiyixia-avatar-v1:'+name);if(data?.startsWith('data:image/')){avatarImages.set(name,data);return data;}}catch{}return '';}
function avatarMarkup(name,profile={},escape=value=>String(value)){const id=profile.avatarPreset||'initial',image=id==='custom'?readAvatarImage(name):avatarArt[id];if(image)return `<img src="${image}" alt="" class="pr-avatar-image" data-avatar-preset="${escape(id)}">`;return `<span class="pr-avatar-initial">${escape(name==='游客'?'客':name.slice(-1))}</span>`;}
function installPresence(product,slot,config){
  const {people,current,profile,guests,escape,icons,onProfile}=config,doc=product.ownerDocument;
  const overflow=doc.createElement('div');overflow.className='pr-overflow';overflow.hidden=true;overflow.setAttribute('role','dialog');overflow.setAttribute('aria-label','其他在线用户');product.append(overflow);let more=null,closeTimer=0;
  const hide=()=>{clearTimeout(closeTimer);overflow.hidden=true;more?.setAttribute('aria-expanded','false');};
  const show=()=>{if(!more)return;clearTimeout(closeTimer);overflow.hidden=false;more.setAttribute('aria-expanded','true');const app=product.getBoundingClientRect(),r=more.getBoundingClientRect();overflow.style.left=Math.max(8,Math.min(r.right-app.left-overflow.offsetWidth,app.width-overflow.offsetWidth-8))+'px';overflow.style.top=(r.bottom-app.top+8)+'px';};
  const scheduleHide=()=>{closeTimer=setTimeout(hide,120);};
  const personButton=member=>`<button type="button" class="pr-avatar" data-person-avatar="${escape(member.name)}" data-tooltip="${escape(member.name+' · '+member.role)}" aria-label="${escape(member.name+'，'+member.role+'，在线')}">${avatarMarkup(member.name,profile(member.name),escape)}<span class="pr-online-dot" aria-hidden="true"></span></button>`;
  let returningFocus=false;
  function render(){
    hide();
    const members=people(),count=Math.max(0,Math.floor(Number(guests())||0)),limit=count?4:5,visible=members.slice(0,limit),extra=members.slice(limit);
    const guest=count?`<button type="button" class="pr-guests" data-presence-guests data-tooltip="${count} 位未登录游客 · 只读" aria-label="${count} 位游客在线"><i data-lucide="users-round" aria-hidden="true"></i>游客(x${count})</button>`:'';
    slot.classList.add('pr-online');
    slot.setAttribute('aria-label',`${members.length} 位登录用户在线${count?'，'+count+' 位游客':''}`);
    slot.innerHTML='<span class="pr-stack">'+visible.map(personButton).join('')+'</span>'+(extra.length?`<button type="button" class="pr-more" aria-label="另外 ${extra.length} 位在线用户" aria-haspopup="dialog" aria-expanded="false">+${extra.length}</button>`:'')+(count?`<span class="pr-guest-group" ${members.length?'data-separated="true"':''}>${guest}</span>`:'');
    slot.hidden=!members.length&&!count;more=slot.querySelector('.pr-more');
    overflow.innerHTML=extra.map(member=>`<div class="pr-overflow-row">${personButton(member)}<span data-tooltip="${escape(member.role)}">${escape(member.name)}</span></div>`).join('');
    if(more){more.onpointerenter=show;more.onpointerleave=scheduleHide;more.onfocus=()=>{if(!returningFocus)show();};more.onclick=show;more.onkeydown=event=>{if(event.key==='Escape'){event.preventDefault();hide();}};}
    const user=current(),name=product.querySelector('[data-current-user-name]'),avatar=product.querySelector('[data-current-user-avatar]'),role=product.querySelector('.gm-user .gm-role,.pc-user .pc-role');
    if(name){name.textContent=user.name;name.dataset.tooltip=user.role;name.hidden=true;}
    if(role)role.hidden=true;
    if(avatar){avatar.innerHTML=avatarMarkup(user.name,profile(user.name),escape);avatar.dataset.tooltip=user.name+' · '+user.role;avatar.setAttribute('aria-label',user.name+'，'+user.role);avatar.onclick=onProfile;}
    icons();
  }
  overflow.addEventListener('pointerenter',()=>clearTimeout(closeTimer));overflow.addEventListener('pointerleave',scheduleHide);overflow.addEventListener('focusin',()=>clearTimeout(closeTimer));overflow.addEventListener('focusout',()=>queueMicrotask(()=>{if(!overflow.contains(doc.activeElement)&&doc.activeElement!==more)hide();}));overflow.addEventListener('keydown',event=>{if(event.key==='Escape'){event.preventDefault();returningFocus=true;hide();more?.focus({preventScroll:true});returningFocus=false;}});
  product.addEventListener('pointerdown',event=>{if(!overflow.contains(event.target)&&!more?.contains(event.target))hide();},true);window.addEventListener('resize',hide);product.addEventListener('scroll',hide,true);render();return {render,hide};
}
function mountAvatarSettings(host,config){
  const {name,profile,enabled,save,escape,icons}=config;let selected=profile().avatarPreset||'initial';
  function paint(){

  }
  host.addEventListener('click',event=>{const button=event.target.closest('button');if(!button||!enabled)return;if(button.dataset.avatarChoice){selected=button.dataset.avatarChoice;save({avatarPreset:selected});paint();}if(button.classList.contains('pr-upload-button'))host.querySelector('input[type="file"]').click();});
  host.addEventListener('change',event=>{
    const input=event.target;if(input.type!=='file'||!enabled)return;const file=input.files?.[0];if(!file)return;
    const fail=text=>{const error=host.querySelector('.pr-avatar-error');if(error){error.textContent=text;error.hidden=false;}};
    const gif=file.type==='image/gif'||!file.type&&/\.gif$/i.test(file.name);
    if(!gif&&!['image/png','image/jpeg','image/webp'].includes(file.type)){fail('请选择 JPG、PNG、WebP 或 GIF 图片');return;}
    if(file.size>5*1024*1024){fail('请选择 5 MB 以内的图片');return;}
    const reader=new FileReader();reader.onerror=()=>fail('图片读取失败，请重新选择');
    reader.onload=()=>{
      if(!host.isConnected)return;const image=new Image();image.onerror=()=>fail('无法读取这张图片，请重新选择');
      image.onload=()=>{
        if(!host.isConnected)return;let data;
